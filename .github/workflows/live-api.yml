name: live-api

# 只用真实账号跑一次接口连通性验证，手动触发，避免日常构建消耗/打扰。
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run live API test
        env:
          PICA_EMAIL: ${{ secrets.PICA_EMAIL }}
          PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
        run: ./gradlew :picaapi:jvmTest --tests 'com.picacompose.picaapi.LiveApiTest' --no-daemon --info

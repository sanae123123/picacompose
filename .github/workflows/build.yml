name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 镜像自带 Android SDK（cmdline-tools 在 /usr/local/lib/android/sdk），
      # 不再用 android-actions/setup-android：它会去找已经下架的 "tools" 包而失败。
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/platforms/* 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test picaapi (JVM)
        run: ./gradlew :picaapi:jvmTest --no-daemon --stacktrace

      - name: Build desktop (JVM)
        run: ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace

      - name: Build Android APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload picaapi test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picaapi-test-reports
          path: picaapi/build/test-results/jvmTest/*.xml
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: picacompose-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
